<!DOCTYPE html>
<head>
<title> Homework 1 Nathan </title>
<link rel="stylesheet" href="stylize.css">
</head>

<body>

  <!--The div containing the header with today's date, image, and company name is below
	I just channged the image from a link reference to a relative path reference
  -->
  <div>
	  <header>
		  <div class="head-materials">
			  <img src="medicalimagea1.jpg"
				  alt="Banner Image for Assignment 1"
				  width="200"
				  height="200">
			  <h1 class="banner"> FunnyBones Medical </h1>
			  <p id="date-display"> </p>
		  </div>
	  </header>
  </div> <br>

  <!-- Below is the div element with the form with external CSS elements -->
  <div>
    <form name="makeaccount" id="makeaccount" action="thankyou.html" class="medical-form" method="get">

	  <!-- Area 1 for the Assignment 2 form is below -->
      <!-- Below is table for the user's whole name -->
      <table>
        <tr>
          <td>
            <label for="fname"> First Name: </label>
            <input type="text" 
				id="fname" 
				name="fname" 
				pattern="[A-Za-z\s'-]{1,30}" 
				required>
          </td>
          <td>
            <label for="mname"> Middle Initial: </label>
            <input type="text" 
				id="mname" 
				name="mname" 
				pattern="[A-Z]{1}">
          </td>
          <td>
            <label for="lname"> Last Name: </label>
            <input type="text" 
				id="lname" 
				name="lname" 
				pattern="[a-zA-Z2-5'-]+" 
				required>
		  </td>
         </tr>
      </table> <br>

	  <!-- The patient's birthday has to be within last 120 years -->
      <label for="dob"> Date of Birth: </label>
      <input type="date"
		  id="dob" name="dob"
		  min="1926-01-01"
		  max="2026-10-23" 
		  required> <br><br>

	  <!-- Area 2 containing the email and phone number for Assignment 2 is below -->
	  <table>
        <tr>
          <td>

			<!-- Format email as something like name@domain.tld -->
            <label for="email"> Email: </label>
            <input type="email" 
				id="email" 
				name="email" 
				pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" 
				required>
          </td>
          <td>

			<!-- Format phone number as something like 000-000-0000 for validation -->
            <label for="phonenum"> Phone Number: </label>
            <input type="text" 
				id="phonenum" 
				name="phonenum" 
				pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" 
				required>
		  </td>
         </tr>
      </table> <br>

	  <!-- Area 3 for the patient's area of residence will be below -->

	  <!-- Address lines 1 and 2 will require anywhere from 2 to 30 characters
		Regex pattern for validation concerning special characters will be worked on for Assignment 3
		Assignment 2 does not require worrying about special characters or fancy editing
	  -->
	  <label for="address1"> Address Line 1: </label>
      <input type="text" 
		  id="address1" 
		  name="address1"
		  minlength="2"
		  maxlength="30"
		  required> <br><br>

      <label for="address2"> Address Line 2: </label>
      <input type="text" 
		  id="address2" 
		  name="address2" 
		  minlength="2"
		  maxlength="30"> <br><br>

	  <!-- The City, State, and Zip Code fields are in the table below -->
	  <table>
        <tr>
          <td>

			<!-- Require 2 to 30 characters for the City -->
            <label for="city"> City: </label>
            <input type="text" 
				id="city" 
				name="city" 
				minlength="2"
				maxlength="30"
				required>
          </td>

		  <!-- The dropdown menu for all 50 states is in the select tag 
			Added a Select a State option
			This for better claryifying to select instead of Alabama being selected by default
		  -->
          <td>
            <label for="state"> State: </label>
            
            <select required>
				
				<!-- A NULL initial value is below so that the user MUST select a valid value for the state -->
				<option value="" disabled selected hidden>(Select a State)</option>

				<!-- All option tags with 50 US states including DC and Puerto Rico are below
				 I changed it from the spelled out versions in my Assignment 1 submission to the 2 letter code versions
				 That was to comply with the guidelines of Assignment 2
				-->
				<option value="al">AL</option>
              	<option value="ak">AL</option>
				<option value="az">AZ</option>
	            <option value="ar">AR</option>
	            <option value="ca">CA</option>
	            <option value="co">CO</option>
	            <option value="ct">CT</option>
	    	    <option value="dc">DC</option>
	            <option value="de">DE</option>
	            <option value="fl">FL</option>
	            <option value="ga">GA</option>
	            <option value="hi">HI</option>
	            <option value="id">ID</option>
	            <option value="il">IL</option>
	            <option value="in">IN</option>
	            <option value="ia">IA</option>
	            <option value="ks">KS</option>
	            <option value="ky">KY</option>
	            <option value="la">LA</option>
	            <option value="me">ME</option>
	            <option value="md">MD</option>
	            <option value="ma">MA</option>
	            <option value="mi">MI</option>
	            <option value="mn">MN</option>
	            <option value="ms">MS</option>
	            <option value="mo">MO</option>
	            <option value="mt">MT</option>
	            <option value="ne">NE</option>
	            <option value="nv">NV</option>
	            <option value="nh">NH</option>
	            <option value="nj">NJ</option>
	            <option value="nm">NM</option>
	            <option value="ny">NY</option>
	            <option value="nc">NC</option>
	            <option value="nd">ND</option>
    	        <option value="oh">OH</option>
	            <option value="ok">OK</option>
	            <option value="or">OR</option>
	            <option value="pa">PA</option>
		        <option value="pr">PR</option>
	            <option value="ri">RI</option>
	            <option value="sc">SC</option>
	            <option value="sd">SD</option>
	            <option value="tn">TN</option>
	            <option value="tx">TX</option>
	            <option value="ut">UT</option>
	            <option value="vt">VT</option>
	            <option value="va">VA</option>
	            <option value="wa">WA</option>
	            <option value="wv">WV</option>
	            <option value="wi">WI</option>
	            <option value="wy">WY</option>
			</select>
		  </td>

		  <!-- The zip code needs 5 to 10 numbers with a Regex Pattern (ex. 12345-6789 or just 12345) that will be validated -->
		  <td>
            <label for="zip"> Zip Code: </label>
            <input type="text" 
				id="zip" 
				name="zip" 
				minlength="5"
				maxlength="10"
				pattern="\d{5}(-\d{4})?" 
				required>
          </td>
		</tr>
	  </table> <br>

	  <!-- Area 4 containing check boxed, radio buttons, text area, user ID, and password entry and re-entry 
		checkboxes are below -->
	  <label> Sickness(es) you have had recently: </label>
	  <input type="checkbox" 
		  id="sickness1" 
		  name="sickness1" 
		  value="Measles">
	  <label for="sickness1"> Measles </label>
	  <input type="checkbox" 
		  id="sickness2" 
		  name="sickness2" 
		  value="CommonCold">
      <label for="sickness2"> Common Cold </label>
	  <input type="checkbox" 
		  id="sickness3" 
		  name="sickness3" 
		  value="Coronavirus">
      <label for="sickness3"> Coronavirus </label>
	  <input type="checkbox" 
		  id="sickness4" 
		  name="sickness4" 
		  value="Pneumonia">
      <label for="sickness4"> Pneumonia </label>
	  <input type="checkbox" 
		  id="sickness5" 
		  name="sickness5" 
		  value="Influenza">
      <label for="sickness5"> Influenza </label> <br><br>

	  <!-- 3 sets of Radio buttons are below -->
	  <label id="gender"> Gender: </label>
	  <input type="radio" 
		  name="gen" 
		  value="Female" 
		  required/>
		<span> Female/F </span>
      <input type="radio" 
		  name="gen" 
		  value="Male" />
		<span> Male/M </span>
      <input type="radio" 
		  name="gen" 
		  value="Other" />
		<span> Other/O </span><br>

	  <label id="agerange"> Age Range: </label>
      <input type="radio" 
		  name="kid" 
		  value="Kid" 
		  required/>
		<span> Under 18 </span>
      <input type="radio" 
		  name="adult" 
		  value="Adult" />
		<span> 18 to 64 </span>
      <input type="radio" 
		  name="senior" 
		  value="Senior" />
		<span> 65 or Older </span> <br>

	  <label id="insured"> Are you insured? </label>
	  <input type="radio" 
		  name="yes" 
		  value="Yes" required/>
		<span> Y </span>
      <input type="radio" 
		  name="yes" 
		  value="No" />
		<span> N </span>

	  <!-- A table with a textarea tag for the reasoning of scheduling an appointment is below -->
	  <table>
		  <tr>
			  <td>
				  <label for="describer"> Describe the reason for your appointment: </label>
			  </td>
			  <td>
				  <textarea id="describer" 
					  name="describer" 
					  rows="5" 
					  cols="60">
					  </textarea>
			  </td>
		  </tr>
	  </table><br>

	  <!-- User ID, Password entry and re-entry will be below with the required attributes for Assifnment 2 -->
	  <table>
		  <tr>
			  <td>
				  <label for="userid"> User ID: </label>
				  <input type="text" 
					  id="userid" 
					  name="userid" 
					  minlength="5" maxlength="30" 
					  pattern="^[a-zA-Z_-][a-zA-Z0-9_-]*$" 
					  required>
			  </td>
		  </tr>
		  <tr>
			  <td>
				  <label for="pwd"> Password: </label>
				  <input type="password" 
					  id="pword" 
					  name="pword" 
					  minlength="8" 
					  required>
			  </td>
			  <td>
				  <label for="pwd"> Re-Type Password: </label>
				  <input type="password" 
					  id="passw" 
					  name="passw" 
					  minlength="8" 
					  required>
			  </td>
		  </tr>
	  </table><br>

	  <!-- REVIEW button below will reference a JavaScript function in the attached .js file in this repository
		This will display the user's intputted values
	  -->
	  <button type="button" onclick='grabdata1()'> REVIEW </button>

	  <!-- CLEAR AND START OVER and sUBMIT buttons will be below with their respective types -->
	  <button type="reset"> CLEAR AND START OVER </button>
	  <button type="submit"> SUBMIT </button>
    </form>
  </div>

  <!-- The div tag containing the web page's footer will be below (changed the header color and font with external CSS) -->
  <div>
	  <footer class="footer-appearance">
		  <center> 
			  <h2> Contact Us </h2>
			  <p> 
				  <a href="mailto:ngaldame@cougarnet.uh.edu"> FunnyBones Medical E-mail </a> 
			  </p>
		  </center>
	  </footer>
  </div>

  <!-- Some JavaScript to display the date in the header is below -->
  <script>
	  var dt = new Date().toDateString();
	  var sentence = "Today is: " + dt;
	  document.getElementById("date-display").textContent = sentence;
  </script>
</body>

</html>
