<!DOCTYPE html>
<head>
<title> Homework 1 Nathan </title>
<link rel="stylesheet" href="stylize.css">
</head>

<body>

  <!--The div containing the header with today's date, image, and company name is below
	I just channged the image from a link reference to a relative path reference
  -->
  <div>
	  <header>
		  <div class="head-materials">
			  <img src="medicalimagea1.jpg"
				  alt="Banner Image for Assignment 1"
				  width="200"
				  height="200">
			  <h1 class="banner"> FunnyBones Medical </h1>
			  <p id="date-display"> </p>
		  </div>
	  </header>
  </div> <br>

  <!-- Below is the div element with the form with external CSS elements -->
  <div>
    <form name="makeaccount" id="makeaccount" action="thankyou.html" class="medical-form" method="get">

	  <!-- Area 1 for the Assignment 2 form is below -->
      <!-- Below is table for the user's whole name -->
      <table>
        <tr>
          <td>
            <label for="fname">First Name:</label>
            <input type="text" 
				id="fname" 
				name="fname" 
				pattern="[A-Za-z\s'-]{1,30}" 
				required>
          </td>
          <td>
            <label for="mname">Middle Initial:</label>
            <input type="text" 
				id="mname" 
				name="mname" 
				pattern="[A-Z]{1}">
          </td>
          <td>
            <label for="lname">Last Name:</label>
            <input type="text" 
				id="lname" 
				name="lname" 
				pattern="[a-zA-Z2-5'-]+" 
				required>
		  </td>
         </tr>
      </table> <br>

	  <!-- The patient's birthday has to be within last 120 years -->
      <label for="dob"> Date of Birth: </label>
      <input type="date"
		  id="dob" name="dob"
		  min="1926-01-01"
		  max="2026-10-23" 
		  required> <br><br>

	  
		
    </form>
  </div>

  <!-- The div tag containing the web page's footer will be below (changed the header color and font with external CSS) -->
  <div>
	  <footer class="footer-appearance">
		  <center> 
			  <h2> Contact Us </h2>
			  <p> 
				  <a href="mailto:ngaldame@cougarnet.uh.edu"> FunnyBones Medical E-mail </a> 
			  </p>
		  </center>
	  </footer>
  </div>

  <!-- Some JavaScript to display the date in the header is below -->
  <script>
	  var dt = new Date().toDateString();
	  var sentence = "Today is: " + dt;
	  document.getElementById("date-display").textContent = sentence;
  </script>
</body>

</html>
